name: Update cleaned feed

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    paths:
      - 'feed-10-08/feed.xml'
      - 'feed-10-08/clean_feed.py'
      - '.github/workflows/update-feed.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install requirements (if any)
        run: |
          python -m pip install --upgrade pip
          # pip install lxml    # uncomment if needed

      - name: Run clean_feed.py (run inside workspace)
        run: |
          cd "$GITHUB_WORKSPACE" || { echo "Cannot cd to GITHUB_WORKSPACE: $GITHUB_WORKSPACE"; exit 2; }
          python ./clean_feed.py ./feed.xml

      - name: Commit and push feed.cleaned.xml if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q 'feed-10-08/feed.cleaned.xml\|feed.cleaned.xml'; then
            git add -A
            git commit -m "Auto-update feed.cleaned.xml (GitHub Actions)" || echo "No commit (no changes)"
            git push origin HEAD
          else
            echo "No changes to feed.cleaned.xml"
          fi
