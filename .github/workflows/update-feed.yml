name: Update cleaned feed

on: workflow_dispatch: {}

jobs: build: runs-on: ubuntu-latest steps: - name: Checkout repository uses: actions/checkout@v4

  - name: Show repo tree (diagnostic)
    run: |
      echo "PWD: $(pwd)"
      echo "---- root ----"
      ls -la
      echo "---- ./feed-10-08 ----"
      ls -la ./feed-10-08 || true
      echo "---- ./feed-10-08/feed-10-08 ----"
      ls -la ./feed-10-08/feed-10-08 || true
      echo "---- ./feed-10-08/feed-10-08/feed-10-08 ----"
      ls -la ./feed-10-08/feed-10-08/feed-10-08 || true
      echo "---- done ----"
