name: Update cleaned feed
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install requirements (if any)
        run: |
          python -m pip install --upgrade pip

      - name: Find and run clean_feed.py
        run: |
          echo "Searching for clean_feed.py..."
          SCRIPT_PATH=$(find . -type f -name 'clean_feed.py' | head -n 1 || true)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "ERROR: clean_feed.py not found in repo"
            exit 2
          fi
          echo "Found: $SCRIPT_PATH"
          # нормализуем абсолютный путь к скрипту и к XML
          SCRIPT_ABS="$(pwd)/${SCRIPT_PATH#./}"
          SCRIPT_DIR="$(dirname \"$SCRIPT_ABS\")"
          XML_FILE="$(find "$SCRIPT_DIR" -maxdepth 1 -type f -name 'feed*.xml' | head -n 1 || true)"
          if [ -z "$XML_FILE" ]; then
            XML_FILE="$SCRIPT_DIR/feed.xml"
          fi
          echo "Script abs path: $SCRIPT_ABS"
          echo "XML abs path: $XML_FILE"
          python "$SCRIPT_ABS" "$XML_FILE"

      - name: Commit and push feed.cleaned.xml if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q 'feed.cleaned.xml\|feed-10-08/feed.cleaned.xml\|feed-10-08/feed-10-08/feed.cleaned.xml'; then
            git add -A
            git commit -m "Auto-update feed.cleaned.xml (GitHub Actions)" || echo "No commit (no changes)"
            git push origin HEAD || echo "Push failed"
          else
            echo "No changes to feed.cleaned.xml"
          fi
